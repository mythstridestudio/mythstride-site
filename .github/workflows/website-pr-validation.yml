name: Website validation

# Runs on pull requests and on what actually lands in main.
#
# It was pull_request only until 2026-09-14, which meant a merge made over a
# red check was never re-checked: PRs #3 and #4 were merged with this workflow
# failing, and because main never ran it, the failure stayed invisible for
# about three weeks. See issue #5.
#
# The two path lists are duplicated on purpose: GitHub Actions does not expand
# YAML anchors, so they have to be kept in step by hand.
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".github/workflows/website-pr-validation.yml"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".github/workflows/website-pr-validation.yml"

permissions:
  contents: read

# A push carries no pull_request.number, so key the group on the ref there and
# keep one in-flight run per PR or per branch rather than one for everything.
concurrency:
  group: website-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Focused tests
        run: npm test

      - name: Validate source content
        run: npm run validate:content

      - name: Build static export
        run: npm run build

      - name: Validate build artifacts
        run: npm run validate:build

      - name: Validate internal links
        run: npm run validate:links
