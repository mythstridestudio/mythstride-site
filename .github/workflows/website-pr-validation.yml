name: Website pull request validation

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".github/workflows/website-pr-validation.yml"

permissions:
  contents: read

concurrency:
  group: website-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Focused tests
        run: npm test

      - name: Validate source content
        run: npm run validate:content

      - name: Build static export
        run: npm run build

      - name: Validate build artifacts
        run: npm run validate:build

      - name: Validate internal links
        run: npm run validate:links
